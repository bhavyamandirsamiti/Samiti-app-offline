        :root { --saffron: #FF9933; --saffron-dark: #e68200; --gold: #D4AF37; --white: #fff; --dark-bg: #1a1a2e; --dark-card: #16213e; --danger: #dc3545; --success: #28a745; --gray: #6c757d; --cyan: #17a2b8; --teal: #20c997; --orange: #fd7e14; --purple: #6f42c1; }

<body>
<div id="loginPage" class="login-container">

        <div style="font-size:11px; margin-top:16px; padding:10px; background:#f0f0f0; border-radius:30px;">

            👉 <strong>operator@mandir.com</strong> / oper123 &nbsp;|&nbsp; <strong>viewer@mandir.com</strong> / view123
        </div>

</div>
<div id="appContainer" class="app-container">

// IndexedDB सेटअप
let db = null;
const DB_NAME = 'MandirMediaDB';
const DB_VERSION = 6;
const STORES = ['memberPhotos', 'committeeLogo', 'eventVideos', 'receiptFiles', 'galleryMedia', 'priestPhotos'];

function openIndexedDB() {
    return new Promise((resolve, reject) => {
        if (db && db.name === DB_NAME) { resolve(db); return; }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
            const db_ = event.target.result;
            STORES.forEach(storeName => {
                if (!db_.objectStoreNames.contains(storeName)) {
                    db_.createObjectStore(storeName, { keyPath: 'id' });
                }
            });
        };
    });
}

async function saveToIndexedDB(storeName, id, data) {
    try {
        const database = await openIndexedDB();
        const tx = database.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.put({ id: id, data: data, updatedAt: new Date().toISOString() });
        return true;
    } catch(e) { return false; }
}

async function getFromIndexedDB(storeName, id) {
    try {
        const database = await openIndexedDB();
        const tx = database.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const request = store.get(id);
        return new Promise((resolve) => {
            request.onsuccess = () => resolve(request.result ? request.result.data : null);
            request.onerror = () => resolve(null);
        });
    } catch(e) { return null; }
}

async function deleteFromIndexedDB(storeName, id) {
    try {
        const database = await openIndexedDB();
        const tx = database.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.delete(id);
        return true;
    } catch(e) { return false; }
}

async function getAllFromIndexedDB(storeName) {
    try {
        const database = await openIndexedDB();
        const tx = database.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const request = store.getAll();
        return new Promise((resolve) => {
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => resolve([]);
        });
    } catch(e) { return []; }
}

// वर्ष फ़ंक्शन
function getAllMonths(joinDate) {
    let join = new Date(joinDate);
    let now = new Date();
    let months = [];
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();
    for(let y=join.getFullYear(); y<=currentYear; y++) {
        let sm = (y===join.getFullYear()) ? join.getMonth() : 0;
        let em = (y===currentYear) ? currentMonth : 11;
        for(let m=sm; m<=em; m++) {
            months.push({ year: y, monthIndex: m, monthName: ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर'][m] });
        }
    }
    return months;
}
function getYearOptions() {
    let currentYear = new Date().getFullYear();
    let opts = '';
    for (let y = 2024; y <= currentYear; y++) { opts += `<option value="${y}">${y}</option>`; }
    return opts;
}
function getDataYears() {
    let currentYear = new Date().getFullYear();
    let years = [];
    for (let y = 2024; y <= currentYear; y++) { years.push(y); }
    return years;
}
function getAmountAtDate(member, date) {
    if(!member.monthlyAmountHistory || member.monthlyAmountHistory.length===0) return member.monthlyAmount;
    let sorted = [...member.monthlyAmountHistory].sort((a,b)=>new Date(a.effectiveDate)-new Date(b.effectiveDate));
    let effective = sorted[0].amount;
    for(let h of sorted) if(new Date(h.effectiveDate) <= new Date(date)) effective = h.amount;
    return effective;
}
function computeAdvanceAndPending() {
    for(let m of appData.members) {
        if(m.status!=='active') continue;
        let monthlyDonations = appData.donations.filter(d=>d.memberId===m.id && d.type==='monthly');
        let advanceDonations = appData.donations.filter(d=>d.memberId===m.id && d.type==='advance');
        let totalAdvance = advanceDonations.reduce((s,d)=>s+d.amount,0);
        let allMonths = getAllMonths(m.joinDate);
        let expected=0, paid=0;
        for(let mon of allMonths) {
            let date = new Date(mon.year, mon.monthIndex, 1);
            expected += getAmountAtDate(m, date);
        }
        paid = monthlyDonations.reduce((s,d)=>s+d.amount,0);
        let pending = expected - paid;
        let advBal = totalAdvance;
        if(advBal>0 && pending>0) { 
            if(advBal>=pending) { advBal-=pending; pending=0; } 
            else { pending-=advBal; advBal=0; }
        }
        m.pending = pending>0?pending:0;
        m.advanceBalance = advBal>0?advBal:0;
    }
    saveToLocalStorage();
}

    let m = appData.members.find(x=>x.id===memberId);

    let paid = appData.donations.filter(d=>d.memberId===m.id && d.type==='monthly').map(d=>`${d.year}_${d.monthIndex}`);
    let pending = allMonths.filter(mon=>!paid.includes(`${mon.year}_${mon.monthIndex}`));
    if(pending.length===0){ showToast("✅ कोई बकाया नहीं"); return; }
    let groups = {};
    pending.forEach(mon=>{ if(!groups[mon.year]) groups[mon.year]=[]; groups[mon.year].push(mon); });
    let years = Object.keys(groups).sort();
    let html = `<div class="modal"><div class="modal-content" style="max-width:700px"><h3>💰 भुगतान - ${m.name}</h3><div class="balance-card" style="margin-bottom:15px;padding:10px"><strong>⭐ एडवांस शेष:</strong> ₹${m.advanceBalance}<br><small>पहले एडवांस उपयोग होगा, फिर नया भुगतान</small></div><div id="multiYearChecklist" class="checklist"></div><div class="flex-between"><div><label>राशि प्रति माह: ₹<span id="displayAmount">${m.monthlyAmount}</span></label></div><select id="payMode" class="form-control" style="width:120px"><option>कैश</option><option>UPI</option></select></div><div id="totalAmountDisplay" class="total-display"></div><div class="flex-between"><button class="btn btn-primary" onclick="processMultiYearPayment(${memberId})">✅ भुगतान करें</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    function renderChecklist() {
        let container = document.getElementById('multiYearChecklist');
        let html2 = '';
        for(let y of years) {
            html2 += `<div class="year-group"><div class="year-header" onclick="toggleYear('${y}')"><div><input type="checkbox" class="yearCheckbox" data-year="${y}" onchange="selectYear('${y}', this.checked)"> <strong>📅 ${y}</strong> (${groups[y].length} महीने)</div><i class="fas fa-chevron-down"></i></div><div class="year-months" id="yearMonths_${y}" style="display:block;">`;
            for(let mon of groups[y]) {
                let amt = getAmountAtDate(m, new Date(mon.year, mon.monthIndex, 1));
                html2 += `<div class="month-item"><input type="checkbox" class="monthCb" data-year="${mon.year}" data-month="${mon.monthIndex}" data-name="${mon.monthName}" data-amount="${amt}"> <label>${mon.monthName} - ₹${amt}</label></div>`;
            }
            html2 += `</div></div>`;
        }
        container.innerHTML = html2;
        document.querySelectorAll('.monthCb').forEach(cb => cb.addEventListener('change', updateTotal));
        document.querySelectorAll('.yearCheckbox').forEach(cb => cb.addEventListener('change', function(e) {
            let year = this.dataset.year;
            document.querySelectorAll(`.monthCb[data-year="${year}"]`).forEach(c => c.checked = this.checked);
            updateTotal();
        }));
        updateTotal();
    }
    window.toggleYear = function(year) { let div = document.getElementById(`yearMonths_${year}`); if(div) div.style.display = div.style.display === 'none' ? 'block' : 'none'; };
    window.selectYear = function(year, checked) { document.querySelectorAll(`.monthCb[data-year="${year}"]`).forEach(cb => cb.checked = checked); updateTotal(); };
    function updateTotal() {
        let total = 0;
        document.querySelectorAll('.monthCb:checked').forEach(cb => { total += parseFloat(cb.dataset.amount); });
        document.getElementById('totalAmountDisplay').innerHTML = `💰 कुल राशि: ₹${total}`;
        let firstChecked = document.querySelector('.monthCb:checked');
        if(firstChecked) document.getElementById('displayAmount').innerText = firstChecked.dataset.amount;
        else document.getElementById('displayAmount').innerText = m.monthlyAmount;
    }
    renderChecklist();
}
function processMultiYearPayment(id) {
    let m = appData.members.find(x=>x.id===id);
    let selected = Array.from(document.querySelectorAll('.monthCb:checked')).map(cb=>({ year: parseInt(cb.dataset.year), monthIndex: parseInt(cb.dataset.monthIndex), monthName: cb.dataset.name, amount: parseFloat(cb.dataset.amount) }));
    if(selected.length===0){ showToast("⚠️ महीना चुनें", true); return; }
    let mode = document.getElementById('payMode').value;
    let remainingAdvance = m.advanceBalance;
    let totalNewPayment = 0;
    let paidList = [];
    for(let s of selected) {
        if(remainingAdvance > 0) {
            if(remainingAdvance >= s.amount) { remainingAdvance -= s.amount; paidList.push({ month: s.monthName, year: s.year, amount: s.amount, paidFrom: "advance" }); }
            else { let fromNew = s.amount - remainingAdvance; remainingAdvance = 0; totalNewPayment += fromNew; appData.donations.push({ id: Date.now(), memberId: m.id, memberName: m.name, type: "monthly", month: s.monthName, monthIndex: s.monthIndex, year: s.year, amount: fromNew, date: new Date().toISOString().slice(0,10), mode: mode }); paidList.push({ month: s.monthName, year: s.year, amount: s.amount, fromNew: fromNew }); }
        } else { totalNewPayment += s.amount; appData.donations.push({ id: Date.now(), memberId: m.id, memberName: m.name, type: "monthly", month: s.monthName, monthIndex: s.monthIndex, year: s.year, amount: s.amount, date: new Date().toISOString().slice(0,10), mode: mode }); paidList.push({ month: s.monthName, year: s.year, amount: s.amount }); }
    }
    if(remainingAdvance !== m.advanceBalance) {
        let advanceDonations = appData.donations.filter(d=>d.memberId===m.id && d.type==='advance').sort((a,b)=>new Date(a.date)-new Date(b.date));
        let usedAdvance = m.advanceBalance - remainingAdvance;
        let toReduce = usedAdvance;
        for(let adv of advanceDonations) {
            if(toReduce <= 0) break;
            if(adv.amount <= toReduce) { toReduce -= adv.amount; adv.amount = 0; }
            else { adv.amount -= toReduce; toReduce = 0; }
        }
        appData.donations = appData.donations.filter(d => !(d.type==='advance' && d.amount===0));
    }
    computeAdvanceAndPending(); saveToLocalStorage(); closeModal();
    if(totalNewPayment > 0) generateReceipt(m, paidList.filter(p=>p.fromNew !== undefined || !p.paidFrom), totalNewPayment, mode, "मासिक भुगतान");
    else showToast(`✅ सभी चयनित महीने एडवांस से कवर हो गए!`);
    renderCurrentPage();
    refreshDashboardCharts();
}

function openAdvanceModal(id) {
    if(!canAddDonation()){ showToast("⚠️ आप एडवांस नहीं जोड़ सकते",true); return; }
    let m = appData.members.find(x=>x.id===id);
    let html = `<div class="modal"><div class="modal-content"><h3>⭐ एडवांस - ${m.name}</h3><p>वर्तमान एडवांस शेष: ₹${m.advanceBalance}</p><p>वर्तमान बकाया: ₹${m.pending}</p><input id="advAmt" type="number" placeholder="राशि" class="form-control"><select id="advMode" class="form-control"><option>कैश</option><option>UPI</option></select><textarea id="advReason" placeholder="कारण (वैकल्पिक)" class="form-control"></textarea><div class="flex-between"><button class="btn btn-primary" onclick="processAdvance(${id})">जमा करें</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div></div></div>`;
    document.body.insertAdjacentHTML('beforeend', html);
}
function processAdvance(id) {
    let m = appData.members.find(x=>x.id===id);
    let amt = parseFloat(document.getElementById('advAmt').value);
    let mode = document.getElementById('advMode').value;
    let reason = document.getElementById('advReason')?.value || "एडवांस जमा";
    if(isNaN(amt) || amt<=0){ showToast("⚠️ सही राशि", true); return; }
    appData.donations.push({ id: Date.now(), memberId: m.id, memberName: m.name, type: "advance", amount: amt, date: new Date().toISOString().slice(0,10), mode: mode, reason: reason });
    computeAdvanceAndPending(); saveToLocalStorage(); closeModal();
    generateReceipt(m, null, amt, mode, "⭐ एडवांस जमा");
    renderCurrentPage();
    refreshDashboardCharts();
}

// बल्क व्हाट्सएप
function startBulk() {
    if(!canSendBulk()){ showToast("⚠️ आप बल्क मैसेज नहीं भेज सकते",true); return; }
    if(bulkInterval) clearInterval(bulkInterval);
    bulkMembers = appData.members.filter(m=>m.status==='active' && m.mobile && !m.hidden);
    if(bulkMembers.length===0){ showToast("⚠️ कोई सदस्य नहीं", true); return; }
    bulkIndex=0;
    let msgDiv = document.getElementById('bulkProgress');
    if(msgDiv) msgDiv.innerHTML = `📨 0/${bulkMembers.length}`;
    showToast("📱 बल्क मैसेज शुरू - कृपया प्रत्येक WhatsApp को मैन्युअली सेंड करें (हर 20 सेकंड में नया खुलेगा)");
    sendNext();
    bulkInterval = setInterval(sendNext, 20000);
}
function sendNext() {
    if(bulkIndex >= bulkMembers.length) { clearInterval(bulkInterval); let msgDiv = document.getElementById('bulkProgress'); if(msgDiv) msgDiv.innerHTML = `✅ सबको भेजा`; showToast("✅ सबको भेजा"); return; }
    let m = bulkMembers[bulkIndex];
    let allMonths = getAllMonths(m.joinDate);
    let msg = `🚩 *जय श्री राम* 🚩\n\nप्रिय ${m.name} जी,\n\nआपका पूरा विवरण:\n`;
    for(let item of allMonths) {
        let isPaid = appData.donations.some(d=>d.memberId===m.id && d.year===item.year && d.month===item.monthName);
        let amt = getAmountAtDate(m, new Date(item.year, item.monthIndex, 1));
        if(isPaid) msg += `✅ ${item.monthName} ${item.year}: ₹${amt} (जमा)\n`;
        else msg += `⭕ ${item.monthName} ${item.year}: ₹${amt} (देय)\n`;
    }
    msg += `\n⚠️ *कुल बकाया:* ₹${m.pending}\n💸 UPI ID: ${appData.settings.upiId}\n📱 *ऑनलाइन भुगतान:* UPI ऐप खोलें\n🙏 धन्यवाद - ${appData.settings.committeeName}`;
    window.open(`https://wa.me/91${m.mobile}?text=${encodeURIComponent(msg)}`, '_blank');
    bulkIndex++;
    let msgDiv = document.getElementById('bulkProgress');
    if(msgDiv) msgDiv.innerHTML = `📨 ${bulkIndex}/${bulkMembers.length} - ${m.name}`;
}
function stopBulk() { if(bulkInterval){ clearInterval(bulkInterval); let msgDiv = document.getElementById('bulkProgress'); if(msgDiv) msgDiv.innerHTML = `⏹️ रोका`; showToast("⏹️ रोका"); } }

function toggleMemberSelection(id, isChecked) { if(isChecked) { if(!selectedMembersForDelete.includes(id)) selectedMembersForDelete.push(id); } else { selectedMembersForDelete = selectedMembersForDelete.filter(i => i !== id); } updateBulkDeleteBar(); let selectAll = document.getElementById('selectAllCheckbox'); if(selectAll) selectAll.checked = selectedMembersForDelete.length === currentFiltered.length && currentFiltered.length > 0; }
function toggleSelectAll() { let selectAll = document.getElementById('selectAllCheckbox'); if(selectAll.checked) { selectedMembersForDelete = currentFiltered.map(m => m.id); document.querySelectorAll('.member-checkbox').forEach(cb => cb.checked = true); } else { selectedMembersForDelete = []; document.querySelectorAll('.member-checkbox').forEach(cb => cb.checked = false); } updateBulkDeleteBar(); }
async function confirmBulkDelete() { if(selectedMembersForDelete.length === 0) return; if(!await confirmDoubleDelete(`${selectedMembersForDelete.length} सदस्य`)) return; let deleted = appData.members.filter(m => selectedMembersForDelete.includes(m.id)); for(let m of deleted) { appData.deletedMembers.push({ ...m, deletedAt: new Date().toISOString(), deletedBy: currentUser.name }); await deleteFromIndexedDB('memberPhotos', m.id.toString()); } appData.members = appData.members.filter(m => !selectedMembersForDelete.includes(m.id)); saveToLocalStorage(); showToast(`✅ ${selectedMembersForDelete.length} सदस्य हटा`); selectedMembersForDelete = []; filterMembers(); addAuditLog("BULK_DELETE", `${selectedMembersForDelete.length} सदस्य हटाए`); refreshDashboardCharts(); }
function clearMemberSelection() { selectedMembersForDelete = []; document.querySelectorAll('.member-checkbox').forEach(cb => cb.checked = false); let selectAll = document.getElementById('selectAllCheckbox'); if(selectAll) selectAll.checked = false; updateBulkDeleteBar(); }
function updateBulkDeleteBar() { let bar = document.getElementById('bulkDeleteBar'); let countSpan = document.getElementById('selectedCount'); if(bar && countSpan) { if(selectedMembersForDelete.length > 0) { bar.style.display = 'flex'; countSpan.innerText = selectedMembersForDelete.length; } else { bar.style.display = 'none'; } } }
function toggleHide(id) { if(!canEditMember()){ showToast("⚠️ आप हाइड नहीं कर सकते",true); return; } let m = appData.members.find(x=>x.id===id); if(m){ m.hidden = !m.hidden; saveToLocalStorage(); filterMembers(); renderHiddenMembers(); showToast(`${m.name} ${m.hidden?'हाइड':'अनहाइड'}`); computeAdvanceAndPending(); if(currentSub==='dashboard') renderDashboard(); refreshDashboardCharts(); } }

}
async function saveMemberEdit(id) {
    let m = appData.members.find(x=>x.id===id);
    let reason = document.getElementById('editReason').value;
    if(!reason){ showToast("⚠️ कारण लिखें", true); return; }
    let oldData = { name: m.name, mobile: m.mobile, village: m.village, father: m.father, monthlyAmount: m.monthlyAmount, joinDate: m.joinDate, photo: m.photo };
    m.name = document.getElementById('editName').value; m.mobile = document.getElementById('editMobile').value;
    m.village = document.getElementById('editVillage').value; m.father = document.getElementById('editFather').value;
    let newJoinDate = document.getElementById('editJoinDate').value; if(newJoinDate) m.joinDate = newJoinDate;
    let newAmt = parseFloat(document.getElementById('editAmount').value); let effDate = document.getElementById('editEffDate').value;
    if(!isNaN(newAmt) && newAmt>0 && newAmt !== m.monthlyAmount){
        if(!m.monthlyAmountHistory) m.monthlyAmountHistory = [];
        m.monthlyAmountHistory.push({ amount: newAmt, effectiveDate: effDate, changedBy: currentUser.name, reason: reason });
        m.monthlyAmount = newAmt;
    }
    let photoFile = document.getElementById('editPhoto').files[0];
    let saveUpdate = async (photoUrl) => { 
        if(photoUrl) {
            m.photo = photoUrl;
            await saveToIndexedDB('memberPhotos', m.id.toString(), photoUrl);
        }
        let newData = { name: m.name, mobile: m.mobile, village: m.village, father: m.father, monthlyAmount: m.monthlyAmount, joinDate: m.joinDate, photo: m.photo }; 
        addEditHistory(m, 'सदस्य', oldData, newData, reason); 
        computeAdvanceAndPending(); 
        saveToLocalStorage(); 
        closeModal(); 
        showToast("✅ अपडेट"); 
        renderMemberList(); 
        refreshDashboardCharts(); 
    };
    if(photoFile) { 
        let reader = new FileReader();
        reader.onload = async (e) => { await saveUpdate(e.target.result); };
        reader.readAsDataURL(photoFile);
    } else { await saveUpdate(null); }
}
async function uploadMemberPhoto(id) {
    if(!canEditMember()){ showToast("⚠️ आप फोटो नहीं बदल सकते",true); return; }
    let input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = async (e) => { 
        let file = e.target.files[0]; 
        if(file) { 
            let reader = new FileReader();
            reader.onload = async (ev) => {
                let m = appData.members.find(x=>x.id===id); 
                m.photo = ev.target.result;
                await saveToIndexedDB('memberPhotos', m.id.toString(), ev.target.result);
                saveToLocalStorage(); 
                showToast("✅ फोटो अपलोड"); 
                renderMemberList(); 
                refreshDashboardCharts();
            };
            reader.readAsDataURL(file);
        } 
    };
    input.click();
}

        reader.onload = async (e) => { await save(e.target.result); };

    } else { await save(""); }
}

    let newId = Math.max(...appData.officers.map(o=>o.id), 0) + 1;

function renderOfficerTransactions() {
    let officerOptions = appData.officers.map(o=>`<option value="${o.id}" ${o.id===6?'selected':''}>${o.name} (${o.post}) - शेष: ₹${o.balance}</option>`).join('');

        <div class="balance-card"><h3>नोट: लेनदेन केवल इन पदाधिकारियों के बीच होगा</h3></div>
        <div class="flex-between"><div><label>करने वाला (From):</label><select id="officerFrom" class="form-control">${officerOptions}</select></div>
        <div><label>पाने वाला (To):</label><select id="officerTo" class="form-control">${officerOptions}</select></div>
        <input type="number" id="officerAmount" placeholder="राशि" class="form-control" style="width:150px">
        <textarea id="officerNote" placeholder="विवरण" class="form-control" style="width:200px"></textarea>
        <button class="btn btn-primary" onclick="processOfficerTransfer()">हस्तांतरण करें</button></div>
        <div class="mt-2"><h3>हस्तांतरण इतिहास</h3><div class="table-wrapper"><table class="data-table"><thead><th>तिथि</th><th>कर्ता</th><th>पाने वाला</th><th>राशि</th><th>विवरण</th><th>द्वारा</th></thead><tbody>${(appData.officerTransfers||[]).slice().reverse().map(t=>`<tr><td>${t.date}<\/td><td>${t.fromName}<\/td><td>${t.toName}<\/td><td class="fine-amount">₹${t.amount}<\/td><td>${t.note||'-'}<\/td><td>${t.by}<\/td><\/tr>`).join('')}</tbody></table></div></div></div>`;
    document.getElementById('contentArea').innerHTML = html;
}
function processOfficerTransfer() {
    let fromId = parseInt(document.getElementById('officerFrom').value);
    let toId = parseInt(document.getElementById('officerTo').value);
    let amount = parseFloat(document.getElementById('officerAmount').value);
    let note = document.getElementById('officerNote').value;
    if(fromId === toId) { showToast("⚠️ एक ही पदाधिकारी को हस्तांतरण नहीं कर सकते", true); return; }
    if(isNaN(amount) || amount<=0){ showToast("⚠️ सही राशि डालें", true); return; }
    let fromOfficer = appData.officers.find(o=>o.id===fromId);
    let toOfficer = appData.officers.find(o=>o.id===toId);
    if(fromOfficer.balance < amount) { showToast(`⚠️ ${fromOfficer.name} के पास इतना बैलेंस नहीं है (शेष: ₹${fromOfficer.balance})`, true); return; }
    fromOfficer.balance -= amount;
    toOfficer.balance += amount;
    let receiptNo = `हस्त-${String(appData.nextTransactionReceiptCounter++).padStart(5,'0')}`;
    let transferRecord = {
        id: Date.now(), type: 'officer_transfer', amount: amount, date: new Date().toISOString().slice(0,10),
        note: note, receiptNo: receiptNo, fromId: fromId, toId: toId, fromName: fromOfficer.name, toName: toOfficer.name,
        fromPost: fromOfficer.post, toPost: toOfficer.post, created_by: currentUser.name, created_at: new Date().toISOString()
    };
    if(!appData.officerTransfers) appData.officerTransfers = [];
    appData.officerTransfers.unshift(transferRecord);
    appData.transactions.push({ ...transferRecord, memberName: `${fromOfficer.name} → ${toOfficer.name}` });
    saveToLocalStorage();
    showToast(`✅ ₹${amount} ${fromOfficer.name} (${fromOfficer.post}) से ${toOfficer.name} (${toOfficer.post}) को हस्तांतरित`);
    renderOfficerTransactions();
    if(currentSub === 'dashboard') renderDashboard();
    addAuditLog("OFFICER_TRANSFER", `${fromOfficer.name} से ${toOfficer.name} को ₹${amount} हस्तांतरित`);
}
function renderTransactionsMain() { 
    if(!canManageTransactions()){ document.getElementById('contentArea').innerHTML='<div class="card">❌ आप लेनदेन नहीं देख सकते</div>'; return; } 
    let totalDeposit = appData.transactions.filter(t=>t.type==='deposit' && !t.deleted).reduce((s,t)=>s+t.amount,0); 
    let totalWithdraw = appData.transactions.filter(t=>t.type==='withdraw' && !t.deleted).reduce((s,t)=>s+t.amount,0); 
    let balance = totalDeposit - totalWithdraw; 
    let years = getDataYears(); 
    let months = ['सभी','जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर']; 
    let html = `<div class="card"><div class="card-title">💰 लेनदेन प्रबंधन<div><button class="print-btn" onclick="printTransactionsList()"><i class="fas fa-print"></i> प्रिंट</button><button class="whatsapp-president-btn" onclick="sendTransactionsToPresident()"><i class="fab fa-whatsapp"></i> अध्यक्ष को भेजें</button></div></div>
    <div class="balance-card"><h3>चालू बैलेंस</h3><p style="font-size:32px; font-weight:bold; color:var(--saffron)">₹${balance}</p><p>कुल जमा: ₹${totalDeposit} | कुल निकासी: ₹${totalWithdraw}</p></div>
    <div class="flex-between"><button class="btn btn-success" onclick="openTransactionModal('deposit')"><i class="fas fa-plus-circle"></i> जमा (+) समिति खाते में</button><button class="btn btn-danger" onclick="openTransactionModal('withdraw')"><i class="fas fa-minus-circle"></i> निकासी (-) समिति खाते से</button>
    <button class="btn btn-info" onclick="renderOfficerTransactions()"><i class="fas fa-exchange-alt"></i> पदाधिकारी हस्तांतरण</button></div>
    <div class="filter-bar"><label>वर्ष: </label><select id="transYearFilter" onchange="renderTransactionsList()">${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
    <label>महीना: </label><select id="transMonthFilter" onchange="renderTransactionsList()">${months.map((m,i)=>`<option value="${i===0?'all':i-1}">${m}</option>`).join('')}</select></div>
    <div class="table-wrapper"><table class="data-table"><thead><th>तिथि</th><th>रसीद नं.</th><th>प्रकार</th><th>विवरण</th><th>राशि (₹)</th><th>कार्य</th></thead><tbody id="transactionListBody"></tbody>追赶</div></div>`;
    document.getElementById('contentArea').innerHTML = html; 
    renderTransactionsList(); 
}
function renderTransactionsList() { 
    let year = document.getElementById('transYearFilter')?.value; 
    let month = document.getElementById('transMonthFilter')?.value; 
    let filtered = appData.transactions.filter(t => !t.deleted); 
    if(year && year !== 'all') filtered = filtered.filter(t => new Date(t.date).getFullYear() == year); 
    if(month && month !== 'all') filtered = filtered.filter(t => new Date(t.date).getMonth() == month); 
    let tbody = document.getElementById('transactionListBody'); 
    if(!tbody) return; 
    tbody.innerHTML = filtered.slice().reverse().map(t=>`<tr><td style="font-size:11px">${t.date}<\/td><td><span class="receipt-no">${t.receiptNo}<\/span><\/td><td class="${t.type==='deposit'?'text-success':'text-danger'}">${t.type==='deposit'?'जमा (+)':(t.type==='withdraw'?'निकासी (-)':'हस्तांतरण')}<\/td><td>${t.note||t.memberName||'-'}<\/td><td class="${t.type==='deposit'?'text-success':'text-danger'}">₹${t.amount}<\/td><td>${canDelete() ? `<button class="btn-sm btn-danger" onclick="deleteTransaction(${t.id})">🗑️</button>` : ''}<button class="btn-sm btn-info" onclick="editTransaction(${t.id})">✏️</button><\/td><\/tr>`).join(''); 
}
function openTransactionModal(type, transactionId=null) { 
    let t = transactionId ? appData.transactions.find(x=>x.id===transactionId) : null; 
    let html = `<div class="modal"><div class="modal-content"><h3>${t ? (t.type==='deposit'?'💰 जमा संपादन':'💸 निकासी संपादन') : (type==='deposit'?'💰 जमा (समिति खाते में)':'💸 निकासी (समिति खाते से)')}</h3>
        <input type="number" id="transAmount" placeholder="राशि" value="${t ? t.amount : ''}" class="form-control">
        <input type="date" id="transDate" value="${t ? t.date : new Date().toISOString().slice(0,10)}" class="form-control">

        <div class="flex-between"><button class="btn btn-primary" onclick="${t ? `updateTransaction(${t.id})` : `saveTransaction('${type}')`}">${t ? 'अपडेट करें' : 'सेव करें'}</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div></div></div>`;

function saveTransaction(type) { 
    let amount = parseFloat(document.getElementById('transAmount').value); 
    let date = document.getElementById('transDate').value; 
    let note = document.getElementById('transNote').value; 
    if(isNaN(amount) || amount<=0){ showToast("⚠️ सही राशि डालें", true); return; } 
    let receiptNo = `लेन-${String(appData.nextTransactionReceiptCounter++).padStart(5,'0')}`; 
    let transaction = { id: Date.now(), type: type, amount: amount, date: date, note: note, receiptNo: receiptNo, memberName: "", created_by: currentUser.name, created_at: new Date().toISOString(), deleted: false, editHistory: [] }; 
    appData.transactions.push(transaction); 
    saveToLocalStorage(); 
    closeModal(); 
    generateTransactionReceipt(transaction); 
    showToast(`✅ लेनदेन सफल! रसीद: ${receiptNo}`); 
    renderTransactionsMain(); 
    addAuditLog(`TRANSACTION_${type.toUpperCase()}`, `₹${amount} - ${note}`); 
    refreshDashboardCharts(); 
}
function editTransaction(id) { openTransactionModal(null, id); }
function updateTransaction(id) { 
    let t = appData.transactions.find(x=>x.id===id); 
    let reason = document.getElementById('transReason').value; 
    if(!reason){ showToast("⚠️ कारण लिखें", true); return; } 
    let oldData = { amount: t.amount, date: t.date, note: t.note }; 
    t.amount = parseFloat(document.getElementById('transAmount').value); 
    t.date = document.getElementById('transDate').value; 
    t.note = document.getElementById('transNote').value; 
    let newData = { amount: t.amount, date: t.date, note: t.note }; 
    addEditHistory(t, 'लेनदेन', oldData, newData, reason); 
    saveToLocalStorage(); 
    closeModal(); 
    showToast("✅ लेनदेन अपडेट"); 
    renderTransactionsMain(); 
    refreshDashboardCharts(); 
}
function generateTransactionReceipt(transaction) { 
    let logo = appData.settings.logo || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF9933' width='100' height='100'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white'%3E🛕%3C/text%3E%3C/svg%3E"; 
    let totalDeposit = appData.transactions.filter(t=>t.type==='deposit' && !t.deleted).reduce((s,t)=>s+t.amount,0); 
    let totalWithdraw = appData.transactions.filter(t=>t.type==='withdraw' && !t.deleted).reduce((s,t)=>s+t.amount,0); 
    let balance = totalDeposit - totalWithdraw; 
    let win = window.open('', '_blank'); 
    win.document.write(`<!DOCTYPE html><html><head><title>लेनदेन रसीद ${transaction.receiptNo}</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;padding:20px;background:#f0f0f0}.receipt{max-width:600px;margin:auto;background:white;border:2px solid #FF9933;border-radius:15px;padding:25px}.header{text-align:center;border-bottom:2px solid #FF9933;padding-bottom:15px;margin-bottom:15px}.logo-img{width:60px;border-radius:50%}.amount{color:#28a745;font-size:22px;font-weight:bold}.signature{margin-top:25px;display:flex;justify-content:space-between;border-top:1px dashed #ddd;padding-top:15px}@media print{body{padding:0;background:white}.receipt{border:none;padding:0}button{display:none}}</style></head><body><div class="receipt"><div class="header"><img src="${logo}" class="logo-img"><h2>${appData.settings.committeeName}</h2><p>लेनदेन रसीद</p><h3>लेनदेन रसीद</h3><strong>${transaction.receiptNo}</strong><p>${new Date(transaction.date).toLocaleDateString('hi-IN')}</p></div><p><strong>प्रकार:</strong> ${transaction.type==='deposit'?'जमा':(transaction.type==='withdraw'?'निकासी':'हस्तांतरण')}</p><p><strong>राशि:</strong> <span class="amount">₹${transaction.amount}</span></p><p><strong>विवरण:</strong> ${transaction.note||'-'}</p><p><strong>कुल जमा:</strong> ₹${totalDeposit}</p><p><strong>कुल निकासी:</strong> ₹${totalWithdraw}</p><p><strong>चालू बैलेंस:</strong> ₹${balance}</p><div class="signature"><div>......................<br>${appData.settings.secretary}<br>(सचिव)</div><div>......................<br>कोषाध्यक्ष</div></div><div class="footer"><p>🙏 जय श्री राम 🙏</p></div><div style="text-align:center;margin-top:20px"><button onclick="window.print()" style="background:#FF9933;padding:10px 20px;border:none;border-radius:8px">🖨️ प्रिंट</button> <button onclick="window.close()">बंद</button></div></div></body></html>`); 
    win.document.close(); 
}

// आयोजन उपस्थिति और जुर्माना
function renderEventAttendance() {
    let events = appData.events.filter(e=>!e.deleted);
    let eventOptions = events.map(e=>`<option value="${e.id}">${e.name} (${e.date})</option>`).join('');
    let fines = appData.fines || [];
    let totalFine = fines.reduce((s,f)=>s+f.amount,0);
    let html = `<div class="card"><div class="card-title">📋 आयोजन उपस्थिति एवं जुर्माना</div><div class="balance-card"><h3>कुल जुर्माना राशि: ₹${totalFine}</h3></div><div class="flex-between"><select id="attendanceEvent" class="form-control" style="width:200px">${eventOptions}</select><button class="btn btn-primary" onclick="loadEventAttendance()">लोड करें</button>${canEdit()?`<button class="btn btn-success" onclick="saveEventAttendance()">उपस्थिति सेव करें</button>`:''}</div><div id="attendanceList"></div><div class="mt-2"><h3>जुर्माना सूची</h3><div id="finesList"></div></div></div>`;
    document.getElementById('contentArea').innerHTML = html;
    loadFinesList();
}
function loadEventAttendance() {
    let eventId = document.getElementById('attendanceEvent')?.value;
    if(!eventId) return;
    let existingAttendance = appData.eventAttendances.find(a=>a.eventId==eventId);
    let members = appData.members.filter(m=>!m.hidden && m.status==='active');
    let html = `<table class="data-table"><thead><th>सदस्य नाम</th><th>उपस्थित</th><th>जुर्माना (₹)</th></thead><tbody>`;
    members.forEach(m => {
        let attendance = existingAttendance ? (existingAttendance.present.includes(m.id) ? true : false) : true;
        let fine = existingAttendance ? (existingAttendance.fines.find(f=>f.memberId===m.id)?.amount || 0) : 0;
        html += `<tr><td class="${getNameClass(m)}">${m.name}<\/td><td><input type="checkbox" class="attendance-cb" data-id="${m.id}" ${attendance?'checked':''}><\/td><td><input type="number" class="fine-input" data-id="${m.id}" value="${fine}" style="width:80px"><\/td><\/tr>`;
    });
    html += `</tbody>追赶<input type="hidden" id="currentEventId" value="${eventId}">`;
    document.getElementById('attendanceList').innerHTML = html;
}
function saveEventAttendance() {
    if(!canEdit()) return;
    let eventId = document.getElementById('currentEventId')?.value;
    if(!eventId) { showToast("⚠️ पहले कोई आयोजन लोड करें", true); return; }
    let present = [];
    let fines = [];
    document.querySelectorAll('.attendance-cb').forEach(cb => { if(cb.checked) present.push(parseInt(cb.dataset.id)); });
    document.querySelectorAll('.fine-input').forEach(inp => {
        let amt = parseFloat(inp.value);
        if(amt > 0) {
            fines.push({ memberId: parseInt(inp.dataset.id), amount: amt });
            let existingFineIndex = appData.fines.findIndex(f=>f.memberId===parseInt(inp.dataset.id) && f.eventId==eventId);
            if(existingFineIndex !== -1) { appData.fines[existingFineIndex].amount = amt; }
            else { appData.fines.push({ id: Date.now(), eventId: eventId, memberId: parseInt(inp.dataset.id), amount: amt, date: new Date().toISOString().slice(0,10) }); }
        }
    });
    let existingIndex = appData.eventAttendances.findIndex(a=>a.eventId==eventId);
    if(existingIndex !== -1) { appData.eventAttendances[existingIndex] = { eventId: eventId, present: present, fines: fines, updatedAt: new Date().toISOString() }; }
    else { appData.eventAttendances.push({ eventId: eventId, present: present, fines: fines, createdAt: new Date().toISOString() }); }
    saveToLocalStorage();
    showToast("✅ उपस्थिति और जुर्माना सेव हो गया");
    loadFinesList();
    refreshDashboardCharts();
}
function loadFinesList() {
    let fines = appData.fines || [];
    let membersMap = new Map();
    appData.members.forEach(m => membersMap.set(m.id, m.name));
    let html = `<table class="data-table"><thead><th>सदस्य नाम</th><th>राशि</th><th>तिथि</th><th>कार्य</th></thead><tbody>`;
    fines.forEach(f => {
        let memberName = membersMap.get(f.memberId) || 'अज्ञात';
        html += `<tr><td class="${getNameClass({pending:0,hidden:false})}">${memberName}<\/td><td class="fine-amount">₹${f.amount}<\/td><td>${f.date}<\/td><td>${canEdit()?`<button class="btn-sm btn-danger" onclick="deleteFine(${f.id})">हटाएं</button>`:''}<\/td><\/tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('finesList').innerHTML = html || '<p>कोई जुर्माना नहीं</p>';
}
async function deleteFine(id) { if(await confirmDoubleDelete("जुर्माना")) { appData.fines = appData.fines.filter(f=>f.id!==id); saveToLocalStorage(); loadFinesList(); refreshDashboardCharts(); showToast("✅ जुर्माना हटा"); } }

function addMeeting(){ if(!canEdit()) return; let t=prompt("शीर्षक"), d=prompt("तिथि (YYYY-MM-DD)"), a=prompt("एजेंडा"); if(t){ if(!appData.meetings) appData.meetings=[]; appData.meetings.push({id:Date.now(), title:t, date:d, agenda:a, editHistory:[]}); saveToLocalStorage(); renderMeetingsList(); showToast("✅ बैठक जुड़ी"); } }
function editMeetingItem(id) { let m = appData.meetings.find(x=>x.id===id); let historyHtml = renderEditHistory(m, 'बैठक'); let html = `<div class="modal"><div class="modal-content"><h3>✏️ बैठक संपादन</h3><input id="editMeetTitle" value="${m.title}" placeholder="शीर्षक" class="form-control"><input type="date" id="editMeetDate" value="${m.date}" class="form-control"><textarea id="editMeetAgenda" placeholder="एजेंडा" class="form-control">${m.agenda||''}</textarea><textarea id="editMeetReason" placeholder="बदलाव का कारण *" class="form-control" required></textarea><div class="flex-between"><button class="btn btn-primary" onclick="updateMeetingItem(${id})">अपडेट करें</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div>${historyHtml}</div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
function updateMeetingItem(id) { let m = appData.meetings.find(x=>x.id===id); let reason = document.getElementById('editMeetReason').value; if(!reason){ showToast("⚠️ कारण लिखें", true); return; } let oldData = { title: m.title, date: m.date, agenda: m.agenda }; m.title = document.getElementById('editMeetTitle').value; m.date = document.getElementById('editMeetDate').value; m.agenda = document.getElementById('editMeetAgenda').value; let newData = { title: m.title, date: m.date, agenda: m.agenda }; addEditHistory(m, 'बैठक', oldData, newData, reason); saveToLocalStorage(); closeModal(); showToast("✅ बैठक अपडेट"); renderMeetingsList(); }
async function deleteMeetingItem(id){ if(!await confirmDoubleDelete("बैठक")) return; let m = appData.meetings.find(x=>x.id===id); if(m){ appData.deletedMeetings.push({ ...m, deletedAt: new Date().toISOString(), deletedBy: currentUser.name }); appData.meetings = appData.meetings.filter(x=>x.id!==id); saveToLocalStorage(); renderMeetingsList(); showToast("✅ बैठक हटा"); addAuditLog("DELETE_MEETING", m.title); } }

function printLedgerReport() { let year = document.getElementById('ledgerYear')?.value || new Date().getFullYear(); let months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर']; let rows = []; let totalInc = 0, totalExp = 0; for(let i=0;i<12;i++){ let inc = appData.donations.filter(d=>new Date(d.date).getMonth()===i && new Date(d.date).getFullYear()==year).reduce((s,d)=>s+d.amount,0); let exp = appData.expenses.filter(e=>new Date(e.date).getMonth()===i && new Date(e.date).getFullYear()==year).reduce((s,e)=>s+e.amount,0); totalInc += inc; totalExp += exp; rows.push([months[i], '₹'+inc, '₹'+exp, '₹'+(inc-exp)]); } rows.push(['कुल', '₹'+totalInc, '₹'+totalExp, '₹'+(totalInc-totalExp)]); printGenericReport(`लेजर रिपोर्ट ${year}`, ['महीना', 'आय', 'व्यय', 'लाभ/हानि'], rows); }

function updateLedger(){ let year = parseInt(document.getElementById('ledgerYear').value); let months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर']; let rows='', totalInc=0, totalExp=0; for(let i=0;i<12;i++){ let inc = appData.donations.filter(d=>new Date(d.date).getMonth()===i && new Date(d.date).getFullYear()===year).reduce((s,d)=>s+d.amount,0); let exp = appData.expenses.filter(e=>new Date(e.date).getMonth()===i && new Date(e.date).getFullYear()===year).reduce((s,e)=>s+e.amount,0); totalInc+=inc; totalExp+=exp; rows += `</table><td style="color:var(--saffron)">${months[i]}<\/td><td class="text-success">₹${inc}<\/td><td class="text-danger">₹${exp}<\/td><td class="${inc-exp>=0?'text-success':'text-danger'}">₹${inc-exp}<\/td><\/tr>`; } document.getElementById('ledgerTable').innerHTML = `<table class="data-table"><thead><th>महीना</th><th>आय</th><th>व्यय</th><th>लाभ/हानि</th></thead><tbody>${rows}</tbody><tfoot><tr style="background:#f0f0f0"><th>कुल</th><th>₹${totalInc}</th><th>₹${totalExp}</th><th>₹${totalInc-totalExp}</th><\/tr><\/tfoot><\/table>`; }

function printTrendReport() { let year = document.getElementById('trendYear')?.value || new Date().getFullYear(); let months = ['जन','फर','मार्च','अप्रैल','मई','जून','जुलाई','अग','सित','अक्टू','नव','दिस']; let rows = []; for(let i=0;i<12;i++){ let inc = appData.donations.filter(d=>new Date(d.date).getMonth()===i && new Date(d.date).getFullYear()==year).reduce((s,d)=>s+d.amount,0); let exp = appData.expenses.filter(e=>new Date(e.date).getMonth()===i && new Date(e.date).getFullYear()==year).reduce((s,e)=>s+e.amount,0); rows.push([months[i], '₹'+inc, '₹'+exp, '₹'+(inc-exp)]); } printGenericReport(`ट्रेंड रिपोर्ट ${year}`, ['महीना', 'आय', 'व्यय', 'लाभ/हानि'], rows); }
function sendTrendReportToPresident() { let year = document.getElementById('trendYear')?.value || new Date().getFullYear(); let totalInc = appData.donations.filter(d=>new Date(d.date).getFullYear()==year).reduce((s,d)=>s+d.amount,0); let totalExp = appData.expenses.filter(e=>new Date(e.date).getFullYear()==year).reduce((s,e)=>s+e.amount,0); let data = `📈 ट्रेंड रिपोर्ट ${year}\n━━━━━━━━━━━━━━━━\n💰 कुल आय: ₹${totalInc}\n💸 कुल व्यय: ₹${totalExp}\n⚖️ शेष: ₹${totalInc-totalExp}\n━━━━━━━━━━━━━━━━`; sendToPresident(`ट्रेंड रिपोर्ट ${year}`, data); }
function loadTrend(){ let year=parseInt(document.getElementById('trendYear').value); let months=['जन','फर','मार्च','अप्रैल','मई','जून','जुलाई','अग','सित','अक्टू','नव','दिस']; let incData=months.map((_,i)=>appData.donations.filter(d=>new Date(d.date).getMonth()===i && new Date(d.date).getFullYear()===year).reduce((s,d)=>s+d.amount,0)); let expData=months.map((_,i)=>appData.expenses.filter(e=>new Date(e.date).getMonth()===i && new Date(e.date).getFullYear()===year).reduce((s,e)=>s+e.amount,0)); let ctx=document.getElementById('trendCanvas')?.getContext('2d'); if(ctx) { if(trendChart) trendChart.destroy(); trendChart = new Chart(ctx,{type:'line',data:{labels:months,datasets:[{label:'आय',data:incData,borderColor:'#28a745'},{label:'व्यय',data:expData,borderColor:'#dc3545'}]}}); } }
function renderExpenseChart(){ let cat={}; appData.expenses.filter(e => !e.deleted).forEach(e=>{cat[e.category]=(cat[e.category]||0)+e.amount;}); let labels=Object.keys(cat), data=Object.values(cat); let total=data.reduce((a,b)=>a+b,0); let html=`<div class="card"><div class="card-title">🥧 व्यय श्रेणी विश्लेषण<div><button class="print-btn" onclick="printExpenseChart()"><i class="fas fa-print"></i> प्रिंट</button><button class="whatsapp-president-btn" onclick="sendExpenseChartToPresident()"><i class="fab fa-whatsapp"></i> अध्यक्ष को भेजें</button></div></div><canvas id="pieCanvas"></canvas><table class="data-table mt-2"><thead><th>श्रेणी</th><th>राशि</th><th>%</th></thead><tbody>${labels.map((l,i)=>`</td><td class="name-active">${l}<\/td><td class="text-danger">₹${data[i]}<\/td><td>${((data[i]/total)*100).toFixed(1)}%<\/td><\/tr>`).join('')}</tbody><\/table><\/div>`; document.getElementById('contentArea').innerHTML=html; let ctx=document.getElementById('pieCanvas')?.getContext('2d'); if(ctx) { if(pieChart) pieChart.destroy(); pieChart = new Chart(ctx,{type:'pie',data:{labels:labels,datasets:[{data:data,backgroundColor:['#FF9933','#28a745','#dc3545','#17a2b8','#6f42c1']}]}}); } }
function printExpenseChart() { let rows = []; appData.expenses.filter(e=>!e.deleted).forEach(e=>{rows.push([e.date, e.category, '₹'+e.amount, e.note||'-']);}); printGenericReport('व्यय सूची', ['तिथि', 'श्रेणी', 'राशि', 'विवरण'], rows); }

    let monthlyExpense = monthsShort.map((_,i)=>appData.expenses.filter(e=>new Date(e.date).getMonth()===i && new Date(e.date).getFullYear()===yearNow).reduce((s,e)=>s+e.amount,0));

    let donorMap = new Map(); appData.donations.forEach(d=>{ if(d.memberName) donorMap.set(d.memberName, (donorMap.get(d.memberName)||0)+d.amount); });
    let topDonors = Array.from(donorMap.entries()).sort((a,b)=>b[1]-a[1]).slice(0,5);
    let html = `<div class="stats-grid"><div class="stat-card" style="border-bottom-color:#FF9933"><div class="stat-value" style="color:#FF9933">${activeMembers}</div><div class="stat-label">सक्रिय सदस्य</div></div><div class="stat-card" style="border-bottom-color:#28a745"><div class="stat-value" style="color:#28a745">₹${totalDonations}</div><div class="stat-label">कुल दान</div></div><div class="stat-card" style="border-bottom-color:#dc3545"><div class="stat-value" style="color:#dc3545">₹${totalPending}</div><div class="stat-label">कुल बकाया</div></div><div class="stat-card" style="border-bottom-color:#17a2b8"><div class="stat-value" style="color:#17a2b8">₹${totalAdvance}</div><div class="stat-label">कुल एडवांस</div></div><div class="stat-card" style="border-bottom-color:#dc3545"><div class="stat-value" style="color:#dc3545">₹${totalFines}</div><div class="stat-label">कुल जुर्माना</div></div><div class="stat-card" style="border-bottom-color:#20c997"><div class="stat-value" style="color:#20c997">₹${monthlyCollection}</div><div class="stat-label">मासिक संग्रह</div></div><div class="stat-card" style="border-bottom-color:#fd7e14"><div class="stat-value" style="color:#fd7e14">₹${todayCol}</div><div class="stat-label">आज संग्रह</div></div><div class="stat-card" style="border-bottom-color:#6f42c1"><div class="stat-value" style="color:#6f42c1">₹${totalExpenses}</div><div class="stat-label">व्यय</div></div><div class="stat-card" style="border-bottom-color:#FF9933"><div class="stat-value" style="color:#FF9933">₹${totalDonations-totalExpenses}</div><div class="stat-label">शेष राशि</div></div></div><div class="card"><div class="card-title">🏆 टॉप 5 दानदाता</div>${topDonors.map(([n,a],i)=>`<div>${i+1}. ${n} - ₹${a}</div>`).join('')}</div><div class="card"><div class="card-title">📈 मासिक आय vs व्यय - ${yearNow}</div><canvas id="monthChart"></canvas></div><div class="card"><div class="card-title">📊 वार्षिक ट्रेंड</div><canvas id="yearChart"></canvas></div><div class="card"><div class="card-title">📨 बल्क WhatsApp (20 सेकंड)</div>${canSendBulk()?`<button class="btn btn-success" onclick="startBulk()"><i class="fab fa-whatsapp"></i> सभी को भेजें</button><button class="btn btn-danger" onclick="stopBulk()">रोकें</button><div id="bulkProgress" class="progress-text"></div>`:'<p>केवल एडमिन</p>'}</div>`;
    document.getElementById('contentArea').innerHTML = html;
    let ctx1 = document.getElementById('monthChart')?.getContext('2d');
    if(ctx1) { if(dashboardMonthChart) dashboardMonthChart.destroy(); dashboardMonthChart = new Chart(ctx1, { type:'bar', data:{ labels:monthsShort, datasets:[{ label:'आय', data:monthlyIncome, backgroundColor:'#28a745' },{ label:'व्यय', data:monthlyExpense, backgroundColor:'#dc3545' }] } }); }
    let ctx2 = document.getElementById('yearChart')?.getContext('2d');
    if(ctx2) { if(dashboardYearChart) dashboardYearChart.destroy(); dashboardYearChart = new Chart(ctx2, { type:'line', data:{ labels:years.map(y=>y.toString()), datasets:[{ label:'आय', data:yearlyIncome, borderColor:'#28a745', fill:false },{ label:'व्यय', data:yearlyExpense, borderColor:'#dc3545', fill:false }] } }); }
}

// व्यय
function renderExpenses(){ if(!canEdit()){ document.getElementById('contentArea').innerHTML='<div class="card">❌ केवल एडमिन</div>'; return; } let years = getDataYears(); let html=`<div class="card"><div class="card-title">💸 व्यय प्रबंधन<div><button class="print-btn" onclick="printExpensesList()"><i class="fas fa-print"></i> प्रिंट</button><button class="whatsapp-president-btn" onclick="sendExpensesToPresident()"><i class="fab fa-whatsapp"></i> अध्यक्ष को भेजें</button></div></div><div class="filter-bar"><label>वर्ष: </label><select id="expenseYearFilter" onchange="renderExpenseList()"><option value="all">सभी</option>${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select><label>श्रेणी: </label><input type="text" id="expenseCategoryFilter" placeholder="श्रेणी खोजें" class="form-control" style="width:150px" onkeyup="renderExpenseList()"></div><div class="flex-between"><input id="expCat" placeholder="श्रेणी" class="form-control" style="width:30%"><input id="expAmt" type="number" placeholder="राशि" class="form-control" style="width:25%"><input id="expNote" placeholder="विवरण" class="form-control" style="width:30%"><button class="btn btn-danger" onclick="addExpense()">जोड़ें</button></div><div id="expList"></div></div>`; document.getElementById('contentArea').innerHTML=html; renderExpenseList(); }
function sendExpensesToPresident() { let total = appData.expenses.filter(e=>!e.deleted).reduce((s,e)=>s+e.amount,0); let recent = appData.expenses.filter(e=>!e.deleted).slice(0,10).map(e=>`${e.date}: ${e.category} - ₹${e.amount}`).join('\n'); let data = `💸 व्यय रिपोर्ट\n━━━━━━━━━━━━━━━━\n💰 कुल व्यय: ₹${total}\n\n📋 हाल के व्यय:\n${recent}\n━━━━━━━━━━━━━━━━`; sendToPresident('व्यय रिपोर्ट', data); }
function addExpense(){ if(!canEdit()) return; let e={id:Date.now(), category:document.getElementById('expCat').value, amount:parseFloat(document.getElementById('expAmt').value), note:document.getElementById('expNote').value, date:new Date().toISOString().slice(0,10), editHistory:[]}; appData.expenses.push(e); saveToLocalStorage(); renderExpenseList(); showToast("✅ व्यय जोड़ा"); addAuditLog("ADD_EXPENSE",e.category); refreshDashboardCharts(); }
function renderExpenseList(){ let year = document.getElementById('expenseYearFilter')?.value; let category = document.getElementById('expenseCategoryFilter')?.value.toLowerCase() || ''; let filtered = appData.expenses.filter(e => !e.deleted); if(year && year !== 'all') filtered = filtered.filter(e => new Date(e.date).getFullYear() == year); if(category) filtered = filtered.filter(e => e.category.toLowerCase().includes(category)); document.getElementById('expList').innerHTML = filtered.map(e=>`<div class="member-card"><div><strong>${e.category}</strong>: ₹${e.amount}<br><small>${e.note} (${e.date})</small></div><div>${canDelete() ? `<button class="btn-sm btn-danger" onclick="deleteExpenseItem(${e.id})">🗑️</button>` : ''}<button class="btn-sm btn-info" onclick="editExpenseItem(${e.id})">✏️</button></div></div>`).join(''); }
function editExpenseItem(id) { let e = appData.expenses.find(x=>x.id===id); let historyHtml = renderEditHistory(e, 'व्यय'); let html = `<div class="modal"><div class="modal-content"><h3>✏️ व्यय संपादन</h3><input id="editExpCat" value="${e.category}" placeholder="श्रेणी" class="form-control"><input id="editExpAmt" type="number" value="${e.amount}" placeholder="राशि" class="form-control"><input id="editExpNote" value="${e.note||''}" placeholder="विवरण" class="form-control"><input type="date" id="editExpDate" value="${e.date}" class="form-control"><textarea id="editExpReason" placeholder="बदलाव का कारण *" class="form-control" required></textarea><div class="flex-between"><button class="btn btn-primary" onclick="updateExpenseItem(${id})">अपडेट करें</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div>${historyHtml}</div></div>`; document.body.insertAdjacentHTML('beforeend', html); }
function updateExpenseItem(id) { let e = appData.expenses.find(x=>x.id===id); let reason = document.getElementById('editExpReason').value; if(!reason){ showToast("⚠️ कारण लिखें", true); return; } let oldData = { category: e.category, amount: e.amount, note: e.note, date: e.date }; e.category = document.getElementById('editExpCat').value; e.amount = parseFloat(document.getElementById('editExpAmt').value); e.note = document.getElementById('editExpNote').value; e.date = document.getElementById('editExpDate').value; let newData = { category: e.category, amount: e.amount, note: e.note, date: e.date }; addEditHistory(e, 'व्यय', oldData, newData, reason); saveToLocalStorage(); closeModal(); showToast("✅ व्यय अपडेट"); renderExpenseList(); refreshDashboardCharts(); }
async function deleteExpenseItem(id){ if(!await confirmDoubleDelete("व्यय")) return; let e = appData.expenses.find(x=>x.id===id); if(e){ appData.deletedExpenses.push({ ...e, deletedAt: new Date().toISOString(), deletedBy: currentUser.name }); appData.expenses = appData.expenses.filter(x=>x.id!==id); saveToLocalStorage(); renderExpenseList(); showToast("✅ व्यय हटा"); addAuditLog("DELETE_EXPENSE", e.category); refreshDashboardCharts(); } }

function sendAdvanceReportToPresident() { let totalAdvance = appData.members.filter(m=>!m.hidden).reduce((s,m)=>s+(m.advanceBalance||0),0); let data = `⭐ एडवांस रिपोर्ट\n━━━━━━━━━━━━━━━━\n💰 कुल एडवांस शेष: ₹${totalAdvance}\n━━━━━━━━━━━━━━━━`; sendToPresident('एडवांस रिपोर्ट', data); }
function renderProfitLoss(){ let years=getDataYears(); let rows=years.map(y=>{let inc=appData.donations.filter(d=>new Date(d.date).getFullYear()===y).reduce((s,d)=>s+d.amount,0); let exp=appData.expenses.filter(e=>new Date(e.date).getFullYear()===y).reduce((s,e)=>s+e.amount,0); return `<tr><td style="color:var(--saffron)">${y}<\/td><td class="text-success">₹${inc}<\/td><td class="text-danger">₹${exp}<\/td><td class="${inc-exp>=0?'text-success':'text-danger'}">₹${inc-exp}<\/td><\/tr>`; }).join(''); document.getElementById('contentArea').innerHTML=`<div class="card"><div class="card-title">📊 लाभ/हानि रिपोर्ट<div><button class="print-btn" onclick="printProfitLoss()"><i class="fas fa-print"></i> प्रिंट</button><button class="whatsapp-president-btn" onclick="sendProfitLossToPresident()"><i class="fab fa-whatsapp"></i> अध्यक्ष को भेजें</button></div></div><table class="data-table"><thead><th>वर्ष</th><th>आय</th><th>व्यय</th><th>लाभ/हानि</th></thead><tbody>${rows}</tbody><\/table><\/div>`; }
function printProfitLoss() { let years=getDataYears(); let rows = years.map(y=>{ let inc=appData.donations.filter(d=>new Date(d.date).getFullYear()===y).reduce((s,d)=>s+d.amount,0); let exp=appData.expenses.filter(e=>new Date(e.date).getFullYear()===y).reduce((s,e)=>s+e.amount,0); return [y.toString(), '₹'+inc, '₹'+exp, '₹'+(inc-exp)]; }); printGenericReport('लाभ/हानि रिपोर्ट', ['वर्ष', 'आय', 'व्यय', 'लाभ/हानि'], rows); }
function sendProfitLossToPresident() { let totalInc = appData.donations.reduce((s,d)=>s+d.amount,0); let totalExp = appData.expenses.reduce((s,e)=>s+e.amount,0); let data = `📊 लाभ/हानि रिपोर्ट\n━━━━━━━━━━━━━━━━\n💰 कुल आय: ₹${totalInc}\n💸 कुल व्यय: ₹${totalExp}\n⚖️ शुद्ध लाभ/हानि: ₹${totalInc-totalExp}\n━━━━━━━━━━━━━━━━`; sendToPresident('लाभ/हानि रिपोर्ट', data); }

// सेटिंग्स
function renderGeneralSettings(){ document.getElementById('contentArea').innerHTML=`<div class="card"><div class="card-title">⚙️ सेटिंग्स</div><input id="setName" value="${appData.settings.committeeName}" class="form-control"><input id="setUpi" value="${appData.settings.upiId}" class="form-control"><input id="setPresident" value="${appData.settings.president}" class="form-control"><input id="setSec" value="${appData.settings.secretary}" class="form-control"><input id="setMobile" value="${appData.settings.presidentMobile}" class="form-control"><input type="file" id="logoUpload" accept="image/*" class="form-control"><input type="file" id="presSigFile" class="form-control"><input type="file" id="secSigFile" class="form-control"><button class="btn btn-primary" onclick="saveSettings()">सेव करें</button></div>`; }
async function saveSettings(){ appData.settings.committeeName=document.getElementById('setName').value; appData.settings.upiId=document.getElementById('setUpi').value; appData.settings.president=document.getElementById('setPresident').value; appData.settings.secretary=document.getElementById('setSec').value; appData.settings.presidentMobile=document.getElementById('setMobile').value; let logoFile = document.getElementById('logoUpload').files[0]; let pf=document.getElementById('presSigFile').files[0]; let sf=document.getElementById('secSigFile').files[0]; let save=async()=>{ saveToLocalStorage(); document.getElementById('headerTitle').innerHTML=appData.settings.committeeName; if(appData.settings.logo) document.getElementById('committeeLogoImg').src=appData.settings.logo; showToast("✅ सेव"); renderGeneralSettings(); }; if(logoFile){ let reader = new FileReader(); reader.onload = async (e) => { appData.settings.logo = e.target.result; await saveToIndexedDB('committeeLogo', 'logo', e.target.result); await save(); }; reader.readAsDataURL(logoFile); } else if(pf){ let r=new FileReader(); r.onload=e=>{ appData.settings.presidentSignature=e.target.result; if(sf){ let r2=new FileReader(); r2.onload=e2=>{ appData.settings.secretarySignature=e2.target.result; save(); }; r2.readAsDataURL(sf); }else save(); }; r.readAsDataURL(pf); } else if(sf){ let r=new FileReader(); r.onload=e=>{ appData.settings.secretarySignature=e.target.result; save(); }; r.readAsDataURL(sf); } else save(); }
function renderUserManagement(){ if(!canEditUser()){ document.getElementById('contentArea').innerHTML='<div class="card">❌ केवल सुपर एडमिन</div>'; return; } let html=`<div class="card"><div class="card-title">👥 यूजर प्रबंधन</div><button class="btn btn-primary" onclick="openAddUserModal()">+ नया यूजर</button><div>${appData.users.map(u=>`<div class="member-card"><div><strong>${u.name}</strong><br><span class="role-${u.role}">${u.role}</span><br>${u.email}</div><div>${u.id!==currentUser.id?`<button class="btn-sm btn-danger" onclick="deleteUser(${u.id})">🗑️</button>`:''}</div></div>`).join('')}</div></div>`; document.getElementById('contentArea').innerHTML=html; }
function openAddUserModal(){ let html=`<div class="modal"><div class="modal-content"><h3>➕ नया यूजर</h3><input id="uname" placeholder="नाम" class="form-control"><input id="uemail" placeholder="ईमेल" class="form-control"><input type="password" id="upass" placeholder="पासवर्ड" class="form-control"><select id="urole"><option value="admin">एडमिन</option><option value="operator">ऑपरेटर</option><option value="viewer">व्यूअर</option></select><button class="btn btn-primary" onclick="addNewUser()">बनाएं</button><button class="btn btn-secondary" onclick="closeModal()">रद्द</button></div></div>`; document.body.insertAdjacentHTML('beforeend',html); }
function addNewUser(){ appData.users.push({id:Date.now(),name:document.getElementById('uname').value,email:document.getElementById('uemail').value,password:document.getElementById('upass').value,role:document.getElementById('urole').value}); saveToLocalStorage(); closeModal(); showToast("✅ यूजर जुड़ा"); renderUserManagement(); }
async function deleteUser(id){ if(!await confirmDoubleDelete("यूजर")) return; appData.users=appData.users.filter(u=>u.id!==id); saveToLocalStorage(); renderUserManagement(); showToast("✅ यूजर हटा"); }
function renderBackup(){ document.getElementById('contentArea').innerHTML=`<div class="card"><div class="card-title">📦 बैकअप</div><div class="flex-between"><button class="btn btn-success" onclick="exportExcel()"><i class="fas fa-file-excel"></i> एक्सेल</button><button class="btn btn-info" onclick="backupJSON()"><i class="fas fa-download"></i> JSON बैकअप</button><button class="btn btn-primary" onclick="exportAllDataJSON()"><i class="fas fa-database"></i> पूरा डाटा JSON</button>${canEditUser() ? `<button class="btn btn-warning" onclick="importAllDataJSON()"><i class="fas fa-upload"></i> JSON इम्पोर्ट</button>` : ''}</div><div class="flex-between mt-2"><button class="btn btn-secondary" onclick="renderImportantLinks()"><i class="fas fa-link"></i> महत्वपूर्ण लिंक्स</button></div></div>`; }
function exportExcel(){ let ws=[['नाम','मोबाइल','गाँव','पिता','मासिक','बकाया','एडवांस','ज्वाइन डेट']]; appData.members.forEach(m=>ws.push([m.name,m.mobile,m.village,m.father||'',m.monthlyAmount,m.pending||0,m.advanceBalance||0,m.joinDate])); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ws),'सदस्य'); XLSX.writeFile(wb,`mandir_${new Date().toISOString().slice(0,10)}.xlsx`); showToast("📊 एक्सेल"); }
function backupJSON(){ let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(appData)],{type:'application/json'})); a.download='mandir_backup.json'; a.click(); showToast("बैकअप"); }
function renderDigitalSignature(){ renderGeneralSettings(); }
function renderProfile(){ document.getElementById('contentArea').innerHTML = `<div class="card"><div class="card-title">👤 मेरी प्रोफाइल</div><p><strong>नाम:</strong> ${currentUser.name}</p><p><strong>ईमेल:</strong> ${currentUser.email}</p><p><strong>रोल:</strong> ${currentUser.role==='super_admin'?'सुपर एडमिन':(currentUser.role==='admin'?'एडमिन':(currentUser.role==='operator'?'ऑपरेटर':'व्यूअर'))}</p><button class="btn btn-primary" onclick="changeUserPassword()"><i class="fas fa-key"></i> पासवर्ड बदलें</button><div class="mt-2 text-muted" style="font-size:12px; color:var(--gray)">⚠️ पासवर्ड भूल गए? सुपर एडमिन से संपर्क करें</div></div>`; }
function renderTopDonors(){ let map=new Map(); appData.donations.forEach(d=>{if(d.memberName) map.set(d.memberName,(map.get(d.memberName)||0)+d.amount);}); let top=Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).slice(0,10); document.getElementById('contentArea').innerHTML=`<div class="card"><div class="card-title">🏆 टॉप दानदाता<button class="print-btn" onclick="printTopDonors()"><i class="fas fa-print"></i> प्रिंट</button></div>${top.map(([n,a],i)=>`<div>${i+1}. ${n} - ₹${a}</div>`).join('')}</div>`; }
function printTopDonors() { let map=new Map(); appData.donations.forEach(d=>{if(d.memberName) map.set(d.memberName,(map.get(d.memberName)||0)+d.amount);}); let top=Array.from(map.entries()).sort((a,b)=>b[1]-a[1]).slice(0,20); let rows = top.map(([n,a],i)=>[i+1, n, '₹'+a]); printGenericReport('टॉप दानदाता', ['क्र.', 'नाम', 'कुल दान'], rows); }
function renderLoginHistory(){ document.getElementById('contentArea').innerHTML=`<div class="card"><div class="card-title">📱 लॉगिन हिस्ट्री<button class="print-btn" onclick="printLoginHistory()"><i class="fas fa-print"></i> प्रिंट</button></div><table class="data-table"><thead><th>तिथि</th><th>यूजर</th><th>रोल</th></thead><tbody>${(appData.loginHistory||[]).slice(0,30).map(h=>`<tr><td style="font-size:11px">${new Date(h.timestamp).toLocaleString()}<\/td><td class="name-pending">${h.user}<\/td><td class="badge-advance">${h.role}<\/td><\/tr>`).join('')}</tbody><\/table><\/div>`; }
function printLoginHistory() { let rows = (appData.loginHistory||[]).slice(0,50).map(h=>[new Date(h.timestamp).toLocaleString(), h.user, h.role]); printGenericReport('लॉगिन हिस्ट्री', ['तिथि', 'यूजर', 'रोल'], rows); }

// नेविगेशन
function renderCurrentPage(){ if(!currentUser) return; let pages={ home:{dashboard:renderDashboard, ledgerReport:renderLedgerReport, auditLog:renderAuditReport}, members:{memberList:renderMemberList, addMember:renderAddMember, memberHistory:renderMemberHistory, committees:renderCommittees, hiddenMembers:renderHiddenMembers, memberPhotoGallery:renderMemberPhotoGallery}, finance:{donations:renderMemberList, expenses:renderExpenses, receiptsList:renderReceiptsList, advancePayment:renderAdvancePayment, profitLoss:renderProfitLoss}, temple:{events:renderEvents, eventVideos:renderEventVideos, ramcharitmanas:renderRamcharitmanas, construction:renderConstruction, gallery:renderGallery, socialLinks:renderSocialLinks, groups:renderGroups, meetings:renderMeetings, announcements:renderAnnouncements, priests:renderPriests, ramayanReading:renderRamayanReading, eventAttendance:renderEventAttendance}, reports:{monthlyReport:renderMonthlyReport, yearlyReport:renderYearlyReport, pendingReport:renderPendingReport, auditReport:renderAuditReport, trendReport:renderTrendReport, expenseChart:renderExpenseChart}, settings:{generalSettings:renderGeneralSettings, userManagement:renderUserManagement, backup:renderBackup, digitalSignature:renderDigitalSignature, recycleBin:renderRecycleBin, importantLinks:renderImportantLinks}, transactions:{transactions:renderTransactionsMain, officerTransactions:renderOfficerTransactions} }; if(pages[currentMain] && pages[currentMain][currentSub]) pages[currentMain][currentSub](); else renderDashboard(); }
function switchMain(id){ pushToStack(currentMain,currentSub); currentMain=id; if(id==='home') currentSub='dashboard'; else if(id==='members') currentSub='memberList'; else if(id==='finance') currentSub='donations'; else if(id==='temple') currentSub='events'; else if(id==='reports') currentSub='monthlyReport'; else if(id==='settings') currentSub='generalSettings'; else if(id==='transactions') currentSub='transactions'; renderNavigation(); renderCurrentPage(); }
function switchSub(id){ pushToStack(currentMain,currentSub); currentSub=id; renderNavigation(); renderCurrentPage(); }
function renderNavigation(){ let mainTabs=[{id:"home",label:"🏠 होम"},{id:"members",label:"👥 सदस्य"},{id:"finance",label:"💰 वित्त"},{id:"temple",label:"🛕 मंदिर"},{id:"reports",label:"📊 रिपोर्ट"},{id:"transactions",label:"💰 लेनदेन"},{id:"settings",label:"⚙️ सेटिंग्स"}]; document.getElementById('mainTabs').innerHTML=mainTabs.map(t=>`<button class="main-tab ${currentMain===t.id?'active':''}" data-tab="${t.id}" onclick="switchMain('${t.id}')">${t.label}</button>`).join(''); let subMap={ home:["dashboard","ledgerReport","auditLog"], members:["memberList","addMember","memberHistory","committees","hiddenMembers","memberPhotoGallery"], finance:["donations","expenses","receiptsList","advancePayment","profitLoss"], temple:["events","eventVideos","ramcharitmanas","construction","gallery","socialLinks","groups","meetings","announcements","priests","ramayanReading","eventAttendance"], reports:["monthlyReport","yearlyReport","pendingReport","auditReport","trendReport","expenseChart"], settings:["generalSettings","userManagement","backup","digitalSignature","recycleBin","importantLinks"], transactions:["transactions","officerTransactions"] }; let subNames={ dashboard:"📊 डैश", ledgerReport:"📒 लेजर", auditLog:"📋 ऑडिट", memberList:"👥 सदस्य", addMember:"➕ जोड़ें", memberHistory:"📜 इतिहास", committees:"🏛️ समिति", hiddenMembers:"🙈 हाइड", memberPhotoGallery:"🖼️ फोटो गैलरी", donations:"💰 भुगतान", expenses:"💸 व्यय", receiptsList:"🧾 रसीदें", advancePayment:"⭐ एडवांस", profitLoss:"📊 लाभ/हानि", events:"🎪 आयोजन", eventVideos:"🎥 आयोजन वीडियो", ramcharitmanas:"📖 रामचरित", construction:"🏗️ निर्माण", gallery:"🖼️ गैलरी", socialLinks:"🔗 लिंक्स", groups:"👥 ग्रुप", meetings:"📅 बैठक", announcements:"📢 घोषणा", priests:"👨‍🦱 पुजारी", ramayanReading:"📖 रामायण पाठ", eventAttendance:"📋 उपस्थिति/जुर्माना", monthlyReport:"📅 मासिक", yearlyReport:"📆 वार्षिक", pendingReport:"⚠️ बकाया", trendReport:"📈 ट्रेंड", expenseChart:"🥧 खर्च", generalSettings:"⚙️ सेटिंग्स", userManagement:"👥 यूजर", backup:"📦 बैकअप", digitalSignature:"🖊️ सिग्नेचर", recycleBin:"🗑️ रीसायकल बिन", importantLinks:"🔗 लिंक्स", transactions:"📊 लेनदेन", officerTransactions:"🔄 पदाधिकारी हस्तांतरण" }; let subs=subMap[currentMain]||["dashboard"]; document.getElementById('subTabs').innerHTML=subs.map(s=>`<button class="sub-tab ${currentSub===s?'active':''}" onclick="switchSub('${s}')">${subNames[s]||s}</button>`).join(''); }
function addLoginHistory(){ if(currentUser) appData.loginHistory.unshift({ user:currentUser.name, email:currentUser.email, role:currentUser.role, timestamp:new Date().toISOString() }); saveToLocalStorage(); }
function doLogin(){ let user=appData.users.find(u=>u.email===document.getElementById('loginEmail').value && u.password===document.getElementById('loginPassword').value); if(user){ currentUser=user; afterLogin(); } else document.getElementById('loginError').innerHTML="❌ गलत ईमेल या पासवर्ड!"; }
async function afterLogin(){ document.getElementById('loginPage').style.display='none'; document.getElementById('appContainer').style.display='block'; document.getElementById('userName').innerHTML=currentUser.name; let roleText=currentUser.role==='super_admin'?'सुपर एडमिन':(currentUser.role==='admin'?'एडमिन':(currentUser.role==='operator'?'ऑपरेटर':'व्यूअर')); document.getElementById('userRoleBadge').innerHTML=roleText; document.getElementById('userRoleBadge').className=`role-${currentUser.role}`; await openIndexedDB(); await loadAllMemberPhotos(); await loadCommitteeLogo(); await loadEventVideos(); await loadReceiptFiles(); await loadGalleryMedia(); await loadPriestPhotos(); computeAdvanceAndPending(); addLoginHistory(); renderNavigation(); renderCurrentPage(); addAuditLog("लॉगिन","सफल"); showToast(`🙏 स्वागत है, ${currentUser.name} जी!`); }
function doLogout(){ if(bulkInterval) clearInterval(bulkInterval); currentUser=null; document.getElementById('loginPage').style.display='flex'; document.getElementById('appContainer').style.display='none'; navigationStack=[]; showToast("🔓 लॉगआउट"); }
if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
document.getElementById('darkModeToggle')?.addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); });
function shareApp(){ let msg=`🚩 ${appData.settings.committeeName}\nऐप लिंक: ${window.location.href}`; if(navigator.share) navigator.share({title:"मन्दिर ऐप",text:msg}); else { navigator.clipboard.writeText(msg); showToast("📋 लिंक कॉपी"); } }
function toggleLanguage(){ let btn=document.querySelector('.lang-btn'); if(btn) btn.innerHTML=btn.innerHTML.includes('English')?'🇮🇳 हिंदी':'🇮🇳 English'; showToast("भाषा बदली"); }
loadFromLocalStorage();
</script>
